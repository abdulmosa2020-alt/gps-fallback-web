<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPS Fallback</title>

<style>
body{
  margin:0;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#111;
  color:white;
}
h1{text-align:center}

.card{
  background:#222;
  padding:18px;
  border-radius:18px;
  margin:12px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin:12px 0;
}

button{
  width:100%;
  padding:17px;
  margin-top:12px;
  border:0;
  border-radius:15px;
  font-size:18px;
  font-weight:bold;
}

#start{background:#30d158}
#motion{background:#0a84ff;color:white}
#simulate{background:#ff9f0a;color:#111}
#reset{background:#555;color:white}

#status{color:#ffd60a}
.small{font-size:14px;color:#bbb}
</style>
</head>

<body>

<h1>GPS Fallback</h1>

<div class="card">

<div class="row">
<span>الحالة</span>
<strong id="status">جاهز</strong>
</div>

<div class="row">
<span>GPS</span>
<strong id="gpsState">متوقف</strong>
</div>

<div class="row">
<span>الحساسات</span>
<strong id="motionState">متوقفة</strong>
</div>

<div class="row">
<span>دقة GPS</span>
<strong id="accuracy">—</strong>
</div>

<div class="row">
<span>السرعة</span>
<strong id="speed">—</strong>
</div>

<div class="row">
<span>الاتجاه</span>
<strong id="heading">—</strong>
</div>

<div class="row">
<span>الثقة</span>
<strong id="confidence">—</strong>
</div>

</div>

<button id="start">تشغيل GPS</button>
<button id="motion">تشغيل حساسات الحركة</button>
<button id="simulate">محاكاة انقطاع GPS</button>
<button id="reset">إنهاء المحاكاة</button>

<div class="card">
<strong>الموقع الحقيقي GPS</strong>
<p id="realCoords" class="small">—</p>

<strong>الموقع المستخدم</strong>
<p id="usedCoords" class="small">—</p>

<strong>خطأ التقدير</strong>
<p id="errorDistance">—</p>

<strong>مدة Fallback</strong>
<p id="fallbackTime">0 ثانية</p>
</div>

<script>

const $ = id => document.getElementById(id);

let gpsStarted = false;
let gpsFix = false;
let motionStarted = false;
let simulateLoss = false;

let realLat = null;
let realLon = null;

let estimatedLat = null;
let estimatedLon = null;

let currentSpeed = 0;
let currentHeading = 0;

let lastEstimateTime = null;
let fallbackStart = null;
let forwardAcceleration = 0;

function distanceMeters(lat1,lon1,lat2,lon2){

  const R = 6371000;

  const p1 = lat1*Math.PI/180;
  const p2 = lat2*Math.PI/180;

  const dp = (lat2-lat1)*Math.PI/180;
  const dl = (lon2-lon1)*Math.PI/180;

  const a =
    Math.sin(dp/2)**2 +
    Math.cos(p1)*Math.cos(p2)*
    Math.sin(dl/2)**2;

  return R*2*Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );
}

function movePoint(lat,lon,distance,heading){

  const R = 6371000;
  const brng = heading*Math.PI/180;

  const p1 = lat*Math.PI/180;
  const l1 = lon*Math.PI/180;

  const d = distance/R;

  const p2 = Math.asin(
    Math.sin(p1)*Math.cos(d) +
    Math.cos(p1)*Math.sin(d)*Math.cos(brng)
  );

  const l2 = l1 + Math.atan2(
    Math.sin(brng)*Math.sin(d)*Math.cos(p1),
    Math.cos(d)-Math.sin(p1)*Math.sin(p2)
  );

  return [
    p2*180/Math.PI,
    l2*180/Math.PI
  ];
}


/* تشغيل GPS */

$("start").onclick = function(){

  if(gpsStarted) return;

  if(!navigator.geolocation){
    $("status").textContent = "GPS غير مدعوم";
    return;
  }

  gpsStarted = true;
  gpsFix = false;

  $("gpsState").textContent = "جاري البحث...";
  $("status").textContent = "جاري البحث عن GPS...";
  $("status").style.color = "#ffd60a";

  navigator.geolocation.watchPosition(

    position => {

      const c = position.coords;

      gpsFix = true;

      $("gpsState").textContent = "يعمل ✓";

      realLat = c.latitude;
      realLon = c.longitude;

      $("realCoords").textContent =
        realLat.toFixed(6) + ", " +
        realLon.toFixed(6);

      $("accuracy").textContent =
        Math.round(c.accuracy) + " متر";

      if(c.speed !== null && c.speed >= 0){

        currentSpeed = c.speed;

        $("speed").textContent =
          (c.speed*3.6).toFixed(1) + " كم/س";
      }

      if(c.heading !== null && !isNaN(c.heading)){

        currentHeading = c.heading;

        $("heading").textContent =
          Math.round(c.heading) + "°";
      }

      if(!simulateLoss){

        estimatedLat = realLat;
        estimatedLon = realLon;

        lastEstimateTime = Date.now();

        $("usedCoords").textContent =
          estimatedLat.toFixed(6) + ", " +
          estimatedLon.toFixed(6);

        if(c.accuracy <= 30){

          $("status").textContent = "GPS موثوق";
          $("status").style.color = "#30d158";

          $("confidence").textContent =
            Math.max(
              70,
              Math.round(100-c.accuracy)
            ) + "%";

        } else {

          $("status").textContent = "GPS ضعيف";
          $("status").style.color = "#ff9f0a";
          $("confidence").textContent = "50%";
        }
      }
    },

    error => {

      gpsStarted = false;
      gpsFix = false;

      $("gpsState").textContent = "متوقف";

      $("status").textContent =
        "تعذر الوصول إلى GPS";

      $("status").style.color = "#ff453a";

      $("start").textContent =
        "إعادة تشغيل GPS";
    },

    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:15000
    }
  );
};


/* حساسات الحركة */

$("motion").onclick = async function(){

  if(motionStarted) return;

  try{

    if(
      typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ){

      const permission =
        await DeviceMotionEvent.requestPermission();

      if(permission !== "granted"){

        alert("لم يتم السماح بالحساسات");
        return;
      }
    }

    motionStarted = true;

    $("motionState").textContent = "تعمل ✓";

    $("motion").textContent =
      "حساسات الحركة تعمل ✓";

    window.addEventListener(
      "devicemotion",
      e => {

        if(
          e.acceleration &&
          e.acceleration.y !== null
        ){
          forwardAcceleration =
            e.acceleration.y;
        }
      }
    );

    window.addEventListener(
      "deviceorientation",
      e => {

        if(
          typeof e.webkitCompassHeading === "number"
        ){

          currentHeading =
            e.webkitCompassHeading;

          $("heading").textContent =
            Math.round(currentHeading) + "°";
        }
      }
    );

  }catch(e){

    alert("تعذر تشغيل حساسات الحركة");
  }
};


/* محاكاة فقدان GPS */

$("simulate").onclick = function(){

  if(
    !gpsStarted ||
    !gpsFix ||
    realLat === null
  ){

    alert(
      "شغّل GPS وانتظر تحديد الموقع أولاً"
    );

    return;
  }

  if(!motionStarted){

    alert(
      "شغّل حساسات الحركة أولاً"
    );

    return;
  }

  simulateLoss = true;

  estimatedLat = realLat;
  estimatedLon = realLon;

  fallbackStart = Date.now();
  lastEstimateTime = Date.now();

  $("status").textContent =
    "Fallback تجريبي";

  $("status").style.color =
    "#ff453a";
};


/* إنهاء المحاكاة */

$("reset").onclick = function(){

  simulateLoss = false;
  fallbackStart = null;

  if(realLat !== null){

    estimatedLat = realLat;
    estimatedLon = realLon;

    $("usedCoords").textContent =
      estimatedLat.toFixed(6) + ", " +
      estimatedLon.toFixed(6);
  }

  $("status").textContent =
    gpsFix ? "GPS مباشر" : "جاهز";

  $("status").style.color =
    gpsFix ? "#30d158" : "#ffd60a";

  $("fallbackTime").textContent =
    "0 ثانية";

  $("errorDistance").textContent =
    "—";
};


/* حساب الموقع أثناء Fallback */

setInterval(() => {

  if(
    !simulateLoss ||
    estimatedLat === null ||
    realLat === null
  ) return;

  const now = Date.now();

  const dt = Math.min(
    (now-lastEstimateTime)/1000,
    1.5
  );

  lastEstimateTime = now;

  const accel =
    Math.max(
      -2,
      Math.min(
        2,
        forwardAcceleration
      )
    );

  currentSpeed += accel*dt;

  if(currentSpeed < 0)
    currentSpeed = 0;

  if(currentSpeed < 0.35)
    currentSpeed = 0;

  const distance =
    currentSpeed*dt;

  const moved =
    movePoint(
      estimatedLat,
      estimatedLon,
      distance,
      currentHeading
    );

  estimatedLat = moved[0];
  estimatedLon = moved[1];

  $("usedCoords").textContent =
    estimatedLat.toFixed(6) + ", " +
    estimatedLon.toFixed(6);

  const error =
    distanceMeters(
      estimatedLat,
      estimatedLon,
      realLat,
      realLon
    );

  $("errorDistance").textContent =
    Math.round(error) + " متر";

  const seconds =
    Math.round(
      (now-fallbackStart)/1000
    );

  $("fallbackTime").textContent =
    seconds + " ثانية";

  const confidence =
    Math.max(
      5,
      100 -
      Math.round(seconds*0.8) -
      Math.round(error/4)
    );

  $("confidence").textContent =
    confidence + "%";

},500);

</script>

</body>
</html>
