<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GPS Fallback v10</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
}
#map{
  height:46vh;
  min-height:360px;
  width:100%;
}
.panel{
  padding:12px;
}
.card{
  background:#1c1c1e;
  border-radius:16px;
  padding:12px;
  margin-bottom:10px;
}
input,button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin:5px 0;
  font-size:17px;
}
input{background:#fff;color:#000}
button{font-weight:bold}
#routeBtn{background:#ffd60a}
#startTripBtn{background:#30d158}
#fallbackBtn{background:#bf5af2;color:#fff}
#restoreBtn{background:#32d74b}
#manualStartBtn{background:#64d2ff}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:5px 0;
}
.value{font-weight:bold}
.good{color:#30d158}
.warn{color:#ff9f0a}
.bad{color:#ff453a}
.small{
  font-size:13px;
  color:#aaa;
  line-height:1.5;
}
.hidden{display:none}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">

<div class="card">
  <input id="destInput" placeholder="إلى أين تريد الذهاب؟">
  <button id="routeBtn">حساب المسار</button>
</div>

<div id="manualStartBox" class="card hidden">
  <div style="margin-bottom:6px">GPS غير متوفر — اكتب نقطة البداية</div>
  <input id="startInput" placeholder="اكتب عنوان البداية">
  <button id="manualStartBtn">اعتماد عنوان البداية</button>
</div>

<div class="card">
  <div class="row"><span>الحالة</span><span id="mode" class="value">جاري البحث عن GPS...</span></div>
  <div class="row"><span>دقة GPS</span><span id="accuracy" class="value">—</span></div>
  <div class="row"><span>السرعة</span><span id="speed" class="value">0 كم/س</span></div>
  <div class="row"><span>الاتجاه</span><span id="heading" class="value">—</span></div>
  <div class="row"><span>المسافة المتبقية</span><span id="remaining" class="value">—</span></div>
  <div class="row"><span>الوقت التقريبي</span><span id="duration" class="value">—</span></div>
</div>

<button id="startTripBtn">ابدأ الرحلة</button>
<button id="fallbackBtn">اختبار فقد GPS</button>
<button id="restoreBtn">إعادة GPS</button>

<div class="card">
  <div class="row"><span>نقطة البداية</span><span id="startStatus">—</span></div>
  <div class="row"><span>الوجهة</span><span id="destStatus">—</span></div>
  <div class="row"><span>الموقع الحالي</span><span id="currentStatus">—</span></div>
</div>

<div class="small">
نسخة اختبار. إذا GPS موجود، نقطة البداية تُحدد تلقائيًا. إذا لم يوجد GPS، يظهر إدخال عنوان البداية يدويًا.
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const $ = id => document.getElementById(id);

const map = L.map("map").setView([50.4501,30.5234],13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"© OpenStreetMap"}
).addTo(map);

let gpsLat=null,gpsLon=null,gpsAccuracy=null,gpsSpeed=0;
let startLat=null,startLon=null;
let destLat=null,destLon=null;
let currentLat=null,currentLon=null;
let routeCoords=[];
let routeLine=null;
let currentMarker=null;
let destMarker=null;
let tripStarted=false;
let simulatedLoss=false;
let watchId=null;
let lastRouteIndex=0;

const TRUSTED_ACC=40;

function haversine(a,b,c,d){
  const R=6371000;
  const p1=a*Math.PI/180;
  const p2=c*Math.PI/180;
  const dp=(c-a)*Math.PI/180;
  const dl=(d-b)*Math.PI/180;
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

async function geocode(q){
  const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q);
  const r=await fetch(url);
  const d=await r.json();
  if(!d.length) return null;
  return {
    lat:parseFloat(d[0].lat),
    lon:parseFloat(d[0].lon),
    name:d[0].display_name
  };
}

function setCurrent(lat,lon){
  currentLat=lat;
  currentLon=lon;

  if(!currentMarker){
    currentMarker=L.circleMarker([lat,lon],{
      radius:10
    }).addTo(map);
  }else{
    currentMarker.setLatLng([lat,lon]);
  }

  $("currentStatus").textContent=lat.toFixed(5)+", "+lon.toFixed(5);
}

function useGpsAsStart(){
  if(gpsLat===null) return;
  startLat=gpsLat;
  startLon=gpsLon;
  $("startStatus").textContent="GPS تلقائي ✓";
}

function startGPS(){
  if(!navigator.geolocation){
    showManualStart();
    return;
  }

  watchId=navigator.geolocation.watchPosition(
    p=>{
      const c=p.coords;

      gpsLat=c.latitude;
      gpsLon=c.longitude;
      gpsAccuracy=c.accuracy;
      gpsSpeed=Number.isFinite(c.speed)?Math.max(0,c.speed):0;

      $("accuracy").textContent=Math.round(gpsAccuracy)+" م";
      $("speed").textContent=Math.round(gpsSpeed*3.6)+" كم/س";

      if(gpsAccuracy<=TRUSTED_ACC){
        $("mode").textContent=simulatedLoss?"Fallback":"GPS شغال";
        $("mode").className=simulatedLoss?"value warn":"value good";

        if(!simulatedLoss){
          useGpsAsStart();
          setCurrent(gpsLat,gpsLon);
          map.setView([gpsLat,gpsLon],16);

          if(tripStarted && routeCoords.length){
            updateProgress();
          }
        }
      }else{
        $("mode").textContent="GPS ضعيف";
        $("mode").className="value warn";
        showManualStart();
      }
    },
    ()=>{
      $("mode").textContent="GPS غير متوفر";
      $("mode").className="value bad";
      showManualStart();
    },
    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:12000
    }
  );
}

function showManualStart(){
  $("manualStartBox").classList.remove("hidden");
}

$("manualStartBtn").onclick=async()=>{
  const q=$("startInput").value.trim();
  if(!q){alert("اكتب عنوان البداية");return;}

  const p=await geocode(q);
  if(!p){alert("لم أجد عنوان البداية");return;}

  startLat=p.lat;
  startLon=p.lon;
  setCurrent(startLat,startLon);
  $("startStatus").textContent="يدوي ✓";
  map.setView([startLat,startLon],16);
};

$("routeBtn").onclick=async()=>{
  const q=$("destInput").value.trim();

  if(!q){
    alert("اكتب الوجهة");
    return;
  }

  if(startLat===null){
    if(gpsLat!==null && gpsAccuracy<=TRUSTED_ACC){
      useGpsAsStart();
    }else{
      showManualStart();
      alert("GPS غير متوفر. اكتب نقطة البداية أولاً.");
      return;
    }
  }

  $("mode").textContent="جاري حساب المسار...";

  const d=await geocode(q);
  if(!d){
    alert("لم أجد الوجهة");
    return;
  }

  destLat=d.lat;
  destLon=d.lon;
  $("destStatus").textContent="تمت ✓";

  if(!destMarker){
    destMarker=L.marker([destLat,destLon]).addTo(map);
  }else{
    destMarker.setLatLng([destLat,destLon]);
  }

  try{
    const url=
    "https://router.project-osrm.org/route/v1/driving/"
    +startLon+","+startLat+";"
    +destLon+","+destLat
    +"?overview=full&geometries=geojson&steps=true";

    const r=await fetch(url);
    const data=await r.json();

    if(!data.routes || !data.routes.length){
      alert("لم أجد طريقًا");
      return;
    }

    const route=data.routes[0];

    routeCoords=route.geometry.coordinates.map(x=>[x[1],x[0]]);

    if(routeLine) map.removeLayer(routeLine);

    routeLine=L.polyline(routeCoords,{weight:7}).addTo(map);

    map.fitBounds(routeLine.getBounds(),{padding:[30,30]});

    $("remaining").textContent=
      route.distance>=1000
      ?(route.distance/1000).toFixed(1)+" كم"
      :Math.round(route.distance)+" م";

    $("duration").textContent=Math.round(route.duration/60)+" دقيقة";

    $("mode").textContent="المسار جاهز";
    $("mode").className="value good";

    lastRouteIndex=0;

  }catch(e){
    alert("فشل حساب المسار");
  }
};

$("startTripBtn").onclick=()=>{
  if(!routeCoords.length){
    alert("احسب المسار أولاً");
    return;
  }

  tripStarted=true;
  $("mode").textContent=simulatedLoss?"Fallback":"الرحلة بدأت";
  $("mode").className=simulatedLoss?"value warn":"value good";

  if(currentLat!==null){
    map.setView([currentLat,currentLon],17);
  }
};

function nearestRouteIndex(lat,lon){
  let best=lastRouteIndex;
  let bestD=Infinity;

  const from=Math.max(0,lastRouteIndex-20);
  const to=Math.min(routeCoords.length-1,lastRouteIndex+150);

  for(let i=from;i<=to;i++){
    const p=routeCoords[i];
    const d=haversine(lat,lon,p[0],p[1]);

    if(d<bestD){
      bestD=d;
      best=i;
    }
  }

  return {index:best,distance:bestD};
}

function updateProgress(){
  if(!routeCoords.length || currentLat===null) return;

  const n=nearestRouteIndex(currentLat,currentLon);

  if(n.distance<150){
    lastRouteIndex=n.index;
  }

  let remaining=0;

  for(let i=lastRouteIndex;i<routeCoords.length-1;i++){
    remaining+=haversine(
      routeCoords[i][0],routeCoords[i][1],
      routeCoords[i+1][0],routeCoords[i+1][1]
    );
  }

  $("remaining").textContent=
    remaining>=1000
    ?(remaining/1000).toFixed(1)+" كم"
    :Math.round(remaining)+" م";

  map.panTo([currentLat,currentLon]);
}

$("fallbackBtn").onclick=()=>{
  if(!tripStarted){
    alert("ابدأ الرحلة أولاً");
    return;
  }

  simulatedLoss=true;
  $("mode").textContent="Fallback";
  $("mode").className="value warn";
};

$("restoreBtn").onclick=()=>{
  simulatedLoss=false;

  if(gpsLat!==null && gpsAccuracy<=TRUSTED_ACC){
    setCurrent(gpsLat,gpsLon);
    $("mode").textContent="GPS شغال";
    $("mode").className="value good";
    updateProgress();
  }
};

startGPS();
</script>

</body>
</html>
